# Resident Evil Gaiden - Recompilation Settings
#
# Shipped defaults reproduce the original Game Boy Color presentation.
# Widescreen, the dynamic flashlight, the atmosphere shaders and the HD texture
# pack are all opt-in - turn them on from the in-game menu (F10) and the game
# will write your choices back to this file.

[Display]
widescreen_mode=0
scaling_mode=1
filter_mode=0
fullscreen=0
window_scale=5
vsync=1
palette_idx=0
orientation_lock=0

[Lighting]
flashlight_enabled=0
flashlight_intensity=85
ambient_darkness=25
flashlight_flicker=1

[Atmosphere]
vignette_enabled=0
vignette_intensity=45
film_grain_enabled=0
grain_intensity=25
scanlines_enabled=0
scanline_intensity=30
crt_mask_enabled=0
crt_mask_intensity=20
color_grade_mode=0

[HDPack]
enable_hd_pack=0
hd_pack_path=hd_pack
enable_hd_backgrounds=1
enable_hd_monsters=1
enable_hd_portraits=1

[MusicPack]
# Drop your own .ogg or .wav files into music_pack/ to replace the in-game
# music. Name them track_<id>.ogg to match the game's music ids (the in-game
# menu shows the id currently playing). No music ships with this project.
enable_music_pack=0
music_pack_path=music_pack
volume=85
duck_percent=25
loop=1

[Audio]
enabled=1
muted=0
volume=100
device_name=
latency_ms=80

[Cheats]
infinite_health=0
infinite_ammo=0
one_hit_kill=0
freeze_reticle=0
all_weapons=0
infinite_items=0

[General]
last_rom_path=
auto_save_state_on_exit=0
speed_percent=100
