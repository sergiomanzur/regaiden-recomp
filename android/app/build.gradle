plugins {
    id 'com.android.application'
}

android {
    namespace "com.capcom.regaiden"
    compileSdk 34
    ndkVersion "26.2.11394342"

    defaultConfig {
        applicationId "com.capcom.regaiden"
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName "0.3.0"

        ndk {
            abiFilters "arm64-v8a"
        }

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_shared",
                          "-DGB_HAS_SDL2=ON",
                          "-DCMAKE_BUILD_TYPE=Release"
                cFlags "-O3", "-ffunction-sections", "-fdata-sections"
                cppFlags "-O3", "-std=c++20", "-ffunction-sections", "-fdata-sections"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
        }
    }

    externalNativeBuild {
        cmake {
            path "jni/CMakeLists.txt"
            version "3.22.1"
        }
    }

    sourceSets {
        main {
            assets.srcDirs = ['src/main/assets']
            res.srcDirs = ['src/main/res']
            java.srcDirs = ['src/main/java']
        }
    }
}

dependencies {
}
